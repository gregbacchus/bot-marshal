name: Version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: version
  cancel-in-progress: false

env:
  # Pin for reproducibility, same as the dist/cargo-dist-version pins elsewhere in this repo.
  COCOGITTO_VERSION: 7.0.0

jobs:
  version:
    name: Bump version, tag, and dispatch release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install cocogitto
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 x86_64-unknown-linux-musl/cog
          cog --version
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if output="$(cog bump --auto --skip-ci 2>&1)"; then
            echo "$output"
            tag="$(git describe --tags --abbrev=0)"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif grep -q "No conventional commit found to bump current version" <<<"$output"; then
            echo "$output"
            echo "No release-worthy commits since the last tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi
      - name: Dispatch artifact release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
