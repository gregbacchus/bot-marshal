name: Version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release:
    name: Tag and dispatch release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      releases: ${{ steps.release.outputs.releases }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release
        uses: release-plz/action@b5543c19b03be9bd48852d20ca89f478b7723260 # v0.5.132
        with:
          command: release
          version: 0.3.161
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Dispatch artifact release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          if [ "$(jq length <<<"$RELEASES")" -ne 1 ]; then
            echo "Expected exactly one release, got: $RELEASES" >&2
            exit 1
          fi
          tag="$(jq -r '.[0].tag' <<<"$RELEASES")"
          gh workflow run release.yml --ref "$tag" -f tag="$tag"

  release-pr:
    name: Update release pull request
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@b5543c19b03be9bd48852d20ca89f478b7723260 # v0.5.132
        with:
          command: release-pr
          version: 0.3.161
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
