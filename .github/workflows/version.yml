name: Version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: version
  cancel-in-progress: false

env:
  # Pin for reproducibility, same as the dist/cargo-dist-version pins elsewhere in this repo.
  COCOGITTO_VERSION: 7.0.0

jobs:
  version:
    name: Bump version, tag, and dispatch release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install cocogitto
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 x86_64-unknown-linux-musl/cog
          cog --version
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `cog bump` exits 0 whether or not it actually created a bump commit — "nothing to
          # bump" is reported on stdout, not via a non-zero exit or any string worth grepping
          # for. So the only reliable signal is whether HEAD actually moved: a real bump always
          # commits and tags; a no-op leaves HEAD exactly where checkout left it. Comparing exit
          # status here previously always looked like success and re-dispatched a release for
          # whatever tag already existed, which then failed at `gh release create` because that
          # tag was already released.
          before="$(git rev-parse HEAD)"
          cog bump --auto --skip-ci
          after="$(git rev-parse HEAD)"

          if [[ "$after" != "$before" ]]; then
            tag="$(git describe --tags --abbrev=0)"
            echo "Bumped to $tag"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits since the last tag — HEAD unchanged."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch artifact release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          # Belt and suspenders alongside the HEAD check above: release.yml is generated by
          # `dist` and hand-edits there do not survive a regen, so this is the resilient place
          # for it. If a release for this tag is already published — a re-run, a manual dispatch
          # after this bump, or a future recurrence of the same class of bug — dispatching again
          # would only fail downstream at `gh release create`, having spent a full build matrix
          # to get there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release for $TAG already exists; not dispatching another"
            exit 0
          fi
          gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
