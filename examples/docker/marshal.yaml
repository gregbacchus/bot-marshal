# Config for the compose example: DNS interception plus source-address identity.

listeners:
  explicit:
    listen: "0.0.0.0:8080"
  transparent:
    enabled: true
    listen: ["0.0.0.0:8081"]
  dns:
    enabled: true
    listen: "0.0.0.0:53"
    # What every intercepted name resolves to: the proxy's address on the demo network.
    proxy_ip: "172.28.0.2"
    passthrough:
      - "*.internal.corp"

tls:
  ca_cert: "/etc/marshal/ca/ca.crt"
  ca_key: "/etc/marshal/ca/ca.key"

upstream:
  deny_cidrs:
    - "169.254.0.0/16"
    - "127.0.0.0/8"
  # The containers are on a private network, and the proxy must reach the internet past it.
  allow_private: true

profiles:
  github-only:
    default_action: deny
    policy:
      - layer: allowlist
        allow: { domains: ["api.github.com", "github.com"] }
        on_match: allow
        on_miss: pass

  llm-only:
    default_action: deny
    policy:
      - layer: allowlist
        allow: { domains: ["api.anthropic.com"] }
        on_match: allow
        on_miss: pass

  # Anything unattributed. Deliberately permits nothing.
  restricted:
    default_action: deny

sessions:
  resolvers:
    # Each container has its own address, which is the whole reason they are static.
    - type: source_ip
      map:
        - { cidr: "172.28.0.10/32", session: "agent-a", profile: github-only }
        - { cidr: "172.28.0.11/32", session: "agent-b", profile: llm-only }

  unidentified:
    profile: restricted
    action: allow_with_profile
