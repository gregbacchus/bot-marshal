# Explicit proxy with source-address identity.

listeners:
  explicit:
    listen: "0.0.0.0:8080"

tls:
  ca_cert: "/etc/marshal/ca/ca.crt"
  ca_key: "/etc/marshal/ca/ca.key"

upstream:
  deny_cidrs:
    - "169.254.0.0/16"
    - "127.0.0.0/8"
  # Public upstream APIs do not require private destination access.
  allow_private: false

# Anything unattributed. Embedded, not named, and deliberately permits nothing — see
# profiles/github-only.yaml and profiles/llm-only.yaml for the two named profiles the
# containers below actually resolve into.
profile:
  default_action: deny

identities:
  resolvers:
    # Each container has its own address, which is the whole reason they are static.
    - type: source_ip
      map:
        - { cidr: "172.28.0.10/32", identity: "agent-a", profile: github-only }
        - { cidr: "172.28.0.11/32", identity: "agent-b", profile: llm-only }

  unidentified:
    action: allow_with_profile
