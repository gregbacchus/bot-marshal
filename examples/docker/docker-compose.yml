# Explicit proxy example: two clients, attributed by static source address.
# Proxy variables route cooperative clients; network policy must enforce containment.

services:
  proxy:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    command: ["serve", "--config", "/etc/marshal/marshal.yaml"]
    environment:
      MARSHAL_LOG: info
      MARSHAL_LOG_SINK: stdout
      MARSHAL_LOG_FORMAT: json
      MARSHAL_LOG_DETAIL: audit
    volumes:
      - ./marshal.yaml:/etc/marshal/marshal.yaml:ro
      - ./profiles:/etc/marshal/profiles:ro
      - ./ca:/etc/marshal/ca:ro
    networks:
      demo:
        ipv4_address: 172.28.0.2

  # Allowed to reach GitHub and nothing else.
  agent-a:
    image: curlimages/curl:latest
    depends_on: [proxy]
    volumes:
      - ./ca/ca.crt:/ca/ca.crt:ro
    environment:
      CURL_CA_BUNDLE: /ca/ca.crt
      HTTP_PROXY: http://172.28.0.2:8080
      HTTPS_PROXY: http://172.28.0.2:8080
      NO_PROXY: ""
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      demo:
        ipv4_address: 172.28.0.10

  # A different profile, distinguished only by its address.
  agent-b:
    image: curlimages/curl:latest
    depends_on: [proxy]
    volumes:
      - ./ca/ca.crt:/ca/ca.crt:ro
    environment:
      CURL_CA_BUNDLE: /ca/ca.crt
      HTTP_PROXY: http://172.28.0.2:8080
      HTTPS_PROXY: http://172.28.0.2:8080
      NO_PROXY: ""
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      demo:
        ipv4_address: 172.28.0.11

networks:
  demo:
    ipam:
      config:
        - subnet: 172.28.0.0/16
