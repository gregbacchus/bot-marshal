#!/usr/sbin/nft -f
#
# Transparent interception for bot-marshal.
#
# Two chains, doing different jobs:
#
#   nat OUTPUT      redirects locally-originated traffic to the proxy. Because a local socket
#                   exists, the proxy can recover the calling uid from /proc/net/tcp and the
#                   `peer_cred` resolver identifies the agent with no rule needed here.
#
#   filter OUTPUT   drops everything else. Without this the redirect is a suggestion: an
#                   agent that talks to port 8443 directly, or uses QUIC, walks straight past.
#
# Adjust MARSHAL_UID to the user the proxy itself runs as. Its own egress must not be
# redirected back into itself.

define MARSHAL_UID = 1000
define PROXY_PORT  = 8081

table ip marshal {
    chain capture {
        type nat hook output priority dstnat; policy accept;

        # The proxy's own connections are how allowed traffic actually leaves. Redirecting
        # them would be an immediate loop.
        meta skuid $MARSHAL_UID return

        # Loopback is local business, not egress.
        oif lo return

        tcp dport { 80, 443 } redirect to :$PROXY_PORT
    }

    chain egress {
        type filter hook output priority filter; policy accept;

        meta skuid $MARSHAL_UID accept
        oif lo accept
        ct state established,related accept

        # QUIC is not interceptable here, and leaving it open means an agent using HTTP/3
        # bypasses the proxy entirely. Blocking it makes clients fall back to TCP.
        udp dport 443 reject

        # DNS goes to the proxy's resolver, or nowhere. An agent that can query arbitrary
        # nameservers has an exfiltration channel no HTTP policy can see.
        udp dport 53 reject
        tcp dport 53 reject

        # Anything not redirected above is not proxied, so it must not leave.
        tcp dport != $PROXY_PORT drop
    }
}

# ---------------------------------------------------------------------------------------
# Optional: distinct identities for agents that share a uid.
#
# Only needed when `peer_cred` cannot separate them — several agents running as the same
# user. Each identity gets its own port, and the `listener_port` resolver maps port to
# profile.
#
# The `drop` rules are load-bearing, not tidiness: without them an agent reaches another
# identity's port directly and chooses its own profile.
