# bot-marshal — example configuration.
#
# The policy chain is ordered and short-circuits: each layer returns ALLOW, DENY or PASS, and
# the first terminal verdict wins. If every layer PASSes, `default_action` decides — that is
# where default-deny actually lives.
#
# Every file under bundles/, profiles/ and transforms/ next to this one is loaded
# automatically, keyed by its filename — no include: needed. `profile:` below is the one
# exception: it's embedded directly, not a named file, because it is the fallback applied to
# traffic nothing else could attribute, and that should be visible in the file someone opens
# first rather than off in profiles/ somewhere. See the README.

listeners:
  explicit:
    listen: "127.0.0.1:8080"          # HTTP CONNECT and SOCKS5, protocol sniffed
    unix_socket: "/run/user/1000/marshal.sock"   # unlocks SO_PEERCRED identity

  # DNS interception: resolve every name to the proxy so unconfigured workloads arrive on
  # their own. A convenience for clients that cannot be configured, not a containment
  # boundary — anything with its own resolver never asks us.
  dns:
    enabled: false
    listen: "127.0.0.1:5353"
    proxy_ip: "127.0.0.1"
    passthrough: ["*.internal.corp", "localhost"]
  management:
    listen: "127.0.0.1:9092"
    api_key_env: "MARSHAL_MANAGEMENT_KEY"

tls:
  ca_cert: "~/.config/bot-marshal/ca.crt"
  ca_key: "~/.config/bot-marshal/ca.key"
  cert_cache_size: 1000
  leaf_expiry_hours: 72
  passthrough: []                     # hosts never intercepted (certificate-pinned clients)

upstream:
  # Checked against every resolved IP, after DNS and before connect. SSRF / rebinding guard.
  deny_cidrs:
    - "169.254.0.0/16"                # link-local, incl. cloud metadata endpoints
    - "127.0.0.0/8"
    - "::1/128"
    - "fe80::/10"
    - "fd00::/8"
  allow_private: false
  max_response_bytes: 0

# The fallback for unattributed traffic — embedded, not named, so it is never sourced from
# profiles/ where it would be easy to miss. Only the denylist and allowlist layers are
# implemented (M1), so this uses just those.
profile:
  default_action: deny
  policy:
    - layer: denylist               # first, so hard denies beat any later approval
      deny:
        domains: ["*.onion"]

    - layer: allowlist
      allow:
        bundles: [github, crates-io]
        domains: ["*.githubusercontent.com"]
      on_match: allow
      on_miss: pass

  transforms: default-headers

# coding-agent and llm-agent (the intended shape for two real agent profiles — dlp, rules and
# judge arrive in M3/M4.5) live under profiles/, one file each, since only this fallback needs
# to be inline. See profiles/coding-agent.yaml and profiles/llm-agent.yaml.

identities:
  # Tried in order; first match wins. Identity is derived from the connection, never asserted
  # by the client — DNS ingress gives the client no way to present a credential. They are
  # listed strongest-first, which is also the order they should be tried:
  #
  #   peer_cred uid  kernel-supplied, unspoofable; only separates agents running as
  #                  different users
  #   launched       cgroup naming convention from `marshal run`; inherited by child
  #                  processes, which is what makes it work for agents that shell out
  #   source_ip      as trustworthy as the network; holds when each agent owns a namespace
  #   proxy_auth     client-asserted; an agent that can read another token can pick another
  #                  profile
  #
  # A resolver can only target a *named* profile (one under profiles/) — the embedded
  # `profile:` above has no name to reference. A connection nothing here matches falls
  # through to `unidentified` below, which uses it by default.
  resolvers:
    - type: peer_cred
      enrich: true                  # needed for cgroup matching; costs a /proc walk
      map:
        - uid: 1001
          identity: "bot-ci"
          profile: coding-agent

    - type: launched                # identities created by `marshal run`

    - type: source_ip               # containers / netns
      map:
        - cidr: "172.20.0.10/32"
          identity: "agent-a"
          profile: coding-agent

    - type: proxy_auth
      credentials:
        - user: "agent-a"
          password_env: "MARSHAL_AGENT_A_PW"
          identity: "agent-a"
          profile: coding-agent

  # Nothing matched: synthetic identity, flagged unattributed in every audit record, served
  # under the embedded `profile:` above (the most restrictive one) by default — set
  # `profile: <name>` here to use a named one instead, or `action: deny` for a hard-fail
  # posture rather than falling back at all.
  unidentified:
    action: allow_with_profile
