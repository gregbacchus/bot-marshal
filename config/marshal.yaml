# bot-marshal — example configuration.
#
# The policy chain is ordered and short-circuits: each layer returns ALLOW, DENY or PASS, and
# the first terminal verdict wins. If every layer PASSes, `default_action` decides — that is
# where default-deny actually lives.

include:
  - bundles/*.yaml

listeners:
  explicit:
    listen: "127.0.0.1:8080"          # HTTP CONNECT and SOCKS5, protocol sniffed
    unix_socket: "/run/user/1000/marshal.sock"   # unlocks SO_PEERCRED identity

  # Transparent interception: connections redirected here by nftables, from clients that do
  # not know they are proxied. See deploy/nftables.conf.
  transparent:
    enabled: false
    listen: ["127.0.0.1:8081"]

  # DNS interception: resolve every name to the proxy so unconfigured workloads arrive on
  # their own. A convenience for clients that cannot be configured, not a containment
  # boundary — anything with its own resolver never asks us.
  dns:
    enabled: false
    listen: "127.0.0.1:5353"
    proxy_ip: "127.0.0.1"
    passthrough: ["*.internal.corp", "localhost"]
  management:
    listen: "127.0.0.1:9092"
    api_key_env: "MARSHAL_MANAGEMENT_KEY"

tls:
  ca_cert: "~/.config/bot-marshal/ca.crt"
  ca_key: "~/.config/bot-marshal/ca.key"
  cert_cache_size: 1000
  leaf_expiry_hours: 72
  passthrough: []                     # hosts never intercepted (certificate-pinned clients)

upstream:
  # Checked against every resolved IP, after DNS and before connect. SSRF / rebinding guard.
  deny_cidrs:
    - "169.254.0.0/16"                # link-local, incl. cloud metadata endpoints
    - "127.0.0.0/8"
    - "::1/128"
    - "fe80::/10"
    - "fd00::/8"
  allow_private: false
  max_response_bytes: 0

profiles:
  # Runnable today. Only the denylist and allowlist layers are implemented (M1), so this
  # profile uses just those. `marshal serve --profile base` works as-is.
  base:
    default_action: deny
    policy:
      - layer: denylist               # first, so hard denies beat any later approval
        deny:
          domains: ["*.onion"]

      - layer: allowlist
        allow:
          bundles: [github, crates-io]
          domains: ["*.githubusercontent.com"]
        on_match: allow
        on_miss: pass

    request_transforms:
      headers:
        allow: ["accept*", "content-*", "user-agent", "authorization"]

  # The intended shape, and not yet runnable: `dlp`, `rules` and `judge` arrive in M3 and
  # M4.5. Starting with this profile fails loudly rather than silently running a chain more
  # permissive than the one written here.

  coding-agent:
    extends: base
    default_action: deny
    policy:
      - layer: denylist
        deny:
          domains: ["*.onion"]

      # `pass`, not `allow`: being on the allowlist is necessary but not sufficient here, so
      # the dlp and rules layers below still get to run. `on_match: allow` would terminate
      # the chain and silently skip them.
      - layer: allowlist
        allow:
          bundles: [github, npm, pypi, crates-io]
        on_match: pass
        on_miss: deny

      - layer: rules                  # CEL over the request and accumulated evidence
        expressions:
          - when: 'req.method in ["POST", "PATCH", "DELETE"]'
            verdict: pass
            annotate:
              flags: ["WriteOperation"]

      # The inverse of injection: catches a real credential the agent obtained some other
      # way and is trying to send out. Scanning bodies means requests it applies to stop
      # streaming, hence the explicit cap and oversize rule.
      - layer: dlp
        scan_request: true
        patterns: ["aws-access-key", "github-pat", "private-key-pem", "openai-key"]
        on_match: deny
        max_body_bytes: 1048576
        on_oversize: deny

      - layer: judge                  # expensive, so it caches and circuit-breaks
        provider:
          type: anthropic
          model: "claude-haiku-4-5-20251001"
          api_key_env: ANTHROPIC_API_KEY
        scope:
          - host: "api.github.com"
            methods: ["POST", "PATCH", "DELETE"]
        cache:
          ttl: "15m"
          max_entries: 10000
        timeout: "8s"
        max_concurrent: 32
        on_error: deny
        on_timeout: deny
        circuit_breaker:
          consecutive_failures: 5
          cooldown: "30s"
        prompt: |
          Allow only changes to repositories owned by gregbacchus. Deny anything that
          modifies workflow files, repository secrets, or repository settings.

    # Applied on the way out, once the chain has allowed. Rewriting is not deciding, which
    # is why these are not policy layers.
    request_transforms:
      headers:
        allow: ["accept*", "content-*", "user-agent", "authorization"]
      # The agent holds only the placeholder. It can still authenticate to hosts the chain
      # allows, but the real credential never exists in the agent's process, environment or
      # filesystem — so compromising the agent no longer costs a rotation.
      secrets:
        - name: GITHUB_TOKEN
          source: { type: env, var: GITHUB_TOKEN }
          proxy_value: "marshal-github-placeholder"
          match_headers: ["authorization"]
          require: true
          rules: [{ host: "api.github.com" }]

    # Applied on the way back to the agent. Body transforms need the whole response in
    # memory, so a profile declaring one is stating that responses they apply to are no
    # longer streamable — keep them scoped away from SSE and WebSocket endpoints.
    response_transforms:
      headers:
        allow: ["content-*", "date", "etag", "cache-control", "retry-after"]
      body:
        # Never let an injected credential echo back to the agent through a response.
        - transform: redact
          patterns: ["github-pat"]

  # An MCP-facing agent. To a host allowlist every MCP call looks identical — one POST to one
  # endpoint — and the difference between `search_repositories` and `delete_repository` is
  # entirely in the body.
  llm-agent:
    extends: base
    default_action: deny
    policy:
      - layer: allowlist
        allow:
          bundles: [llm-apis]
          domains: ["mcp.example.com"]
        on_match: pass
        on_miss: deny

      # Denied tools are also removed from `tools/list`, so the agent never forms the intent
      # to call them. That matters more than blocking the call: an error is something an
      # LLM-driven agent retries and works around.
      - layer: mcp
        servers:
          - name: github
            rules: [{ host: "mcp.example.com" }]
            tools:
              - name: "search_*"
              - name: "create_issue"
                when: [{ path: "owner", equals: "gregbacchus" }]
              - name: "update_file"
                when:
                  - path: repo
                    in: ["bot-marshal"]
                  - path: path
                    matches: "^src/"

sessions:
  # Tried in order; first match wins. Identity is derived from the connection, never asserted
  # by the client — transparent and DNS ingress give the client no way to present a
  # credential. They are listed strongest-first, which is also the order they should be tried:
  #
  #   peer_cred uid  kernel-supplied, unspoofable; only separates agents running as
  #                  different users
  #   launched       cgroup naming convention from `marshal run`; inherited by child
  #                  processes, which is what makes it work for agents that shell out
  #   source_ip      as trustworthy as the network; holds when each agent owns a namespace
  #   proxy_auth     client-asserted; an agent that can read another token can pick another
  #                  profile
  resolvers:
    - type: peer_cred
      enrich: true                  # needed for cgroup matching; costs a /proc walk
      map:
        - uid: 1001
          session: "bot-ci"
          profile: base

    - type: launched                # sessions created by `marshal run`

    - type: source_ip               # containers / netns
      map:
        - cidr: "172.20.0.10/32"
          session: "agent-a"
          profile: coding-agent

    - type: proxy_auth
      credentials:
        - user: "agent-a"
          password_env: "MARSHAL_AGENT_A_PW"
          session: "agent-a"
          profile: coding-agent

  # Nothing matched: synthetic session, most restrictive profile, flagged unattributed in
  # every audit record. Set `action: deny` for a hard-fail posture.
  unidentified:
    profile: base
    action: allow_with_profile
