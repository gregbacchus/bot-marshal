[workspace]
# Only fixes, features, and explicitly breaking changes request a release.
release_commits = "^(fix|feat)(\\([^)]*\\))?!?:|^[a-z]+(\\([^)]*\\))?!:"
# Keep the documented Conventional Commit behavior for pre-1.0 releases.
features_always_increment_minor = true
git_only = true
git_release_enable = false
git_tag_enable = false
release = false
release_always = false
pr_labels = ["release"]

[[package]]
name = "marshal-cli"
release = true
publish = false
semver_check = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
changelog_include = [
  "marshal-audit",
  "marshal-config",
  "marshal-core",
  "marshal-dns",
  "marshal-http",
  "marshal-judge",
  "marshal-launch",
  "marshal-policy",
  "marshal-proxy",
  "marshal-secrets",
  "marshal-tls",
]
