[workspace]
# Only fixes, features, and explicitly breaking changes request a release.
release_commits = "^(fix|feat)(\\([^)]*\\))?!?:|^[a-z]+(\\([^)]*\\))?!:"
# Keep the documented Conventional Commit behavior for pre-1.0 releases.
features_always_increment_minor = true
git_only = true
git_release_enable = false
git_tag_enable = false
release = false
release_always = false
pr_labels = ["release"]
# No crate is published, and only marshal-cli is independently released — the rest exist
# only as changelog_include entries. Defaulting these here, not just on marshal-cli, is what
# actually matters: release-plz runs `cargo package` to compute a semver diff regardless of
# `release`/Cargo.toml's `publish`, and that fails on any crate whose path dependencies (all
# of them, workspace-wide) lack a version requirement. See docs/adr/0002 on why marshal-core
# has no marshal-* dependency to avoid this for at least the base of the graph.
publish = false
semver_check = false

[[package]]
name = "marshal-cli"
release = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
changelog_include = [
  "marshal-audit",
  "marshal-config",
  "marshal-core",
  "marshal-dns",
  "marshal-http",
  "marshal-judge",
  "marshal-launch",
  "marshal-policy",
  "marshal-proxy",
  "marshal-secrets",
  "marshal-tls",
]
