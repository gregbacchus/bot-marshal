[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Only the command-line application is released from this workspace.
packages = ["marshal-cli"]
# CI backends to support
ci = "github"
# Releases are dispatched by release-plz after it creates the version tag.
dispatch-releases = true
# Build every target on pull requests so platform failures cannot reach a release tag.
pr-run-mode = "upload"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Publish stable releases to the conventional Homebrew tap.
tap = "gregbacchus/homebrew-tap"
publish-jobs = ["homebrew"]
# Match the project and tap name rather than the internal Cargo package name.
formula = "bot-marshal"
# release.yml carries hand-edits dist doesn't know about: a pull request builds only
# x86_64-unknown-linux-gnu instead of every target, and skips the global (checksums/Homebrew
# formula) step outright, since it needs every target's artifacts to be meaningful and a pull
# request never publishes anyway. See the comments at each edit's site in release.yml.
allow-dirty = ["ci"]
